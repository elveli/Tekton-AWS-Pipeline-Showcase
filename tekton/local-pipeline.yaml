apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: local-demo-pipeline
  namespace: build-system
spec:
  workspaces:
    - name: shared-data
  params:
    - name: git-url
      type: string
    - name: image-url
      type: string
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-data
      params:
        - name: url
          value: $(params.git-url)
        - name: deleteExisting
          value: "true"

    - name: build-and-push-local
      taskRef:
        name: kaniko-local
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: IMAGE
          value: $(params.image-url)

    - name: deploy-locally
      taskRef:
        name: deploy-eks # The deploy task works locally too!
      runAfter:
        - build-and-push-local
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: IMAGE
          value: $(params.image-url)
